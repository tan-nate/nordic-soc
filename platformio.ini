[env:nrf52_dk]
platform = nordicnrf52
board = nrf52_dk
framework = mbed
build_flags =
    -Ilib/SimulinkModel
    -Ilib/ekf
    -mcpu=cortex-m4
    -mthumb
    -mfpu=fpv4-sp-d16
    -mfloat-abi=softfp

    ; Extra include paths for the nRF5 SDK
    -I${PROJECT_DIR}/nRF5_SDK/components/libraries/util/include
    -I${PROJECT_DIR}/nRF5_SDK/modules/nrfx/mdk
    -I${PROJECT_DIR}/nRF5_SDK/components/softdevice/s132/headers
    ; (add more -I paths as needed)
    ; You may also add any necessary macro definitions:
    -DNRF52  ; or whatever macro your SDK requires for the target chip

lib_extra_dirs =
    ${PROJECT_DIR}/nRF5_SDK/components/libraries/util
    ; (add additional directories if you have libraries to link)